<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}html{color-scheme:light dark}</style></head><body><title>Menu Del Bosco</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: customer menu. Category tabs, item cards with size buttons, fixed order bar, order sheet with name, phone, delivery or pickup. */
:root{--bg:#f6f4ef;--panel:#ffffff;--tx:#17130e;--mut:#6c655b;--line:#e2ddd2;--pr:#a87500;--green:#1a7f3c;--red:#c8202a;--btn:#17130e;--btntx:#ffffff;--chip:#ece8de;--font:'Poppins',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0b;--panel:#161616;--tx:#f4f1ea;--mut:#9d978c;--line:#2a2a2a;--pr:#f2c230;--green:#35b45f;--red:#f0505a;--btn:#f4f1ea;--btntx:#0b0b0b;--chip:#222;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0b0b;--panel:#161616;--tx:#f4f1ea;--mut:#9d978c;--line:#2a2a2a;--pr:#f2c230;--green:#35b45f;--red:#f0505a;--btn:#f4f1ea;--btntx:#0b0b0b;--chip:#222;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:var(--font);font-size:15px;margin:0;padding-block:0 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:720px;margin:0 auto}
header{padding:16px 0 4px}
h1{font-size:22px;margin:0;letter-spacing:1px;font-weight:700}
.flag{height:4px;width:60px;border-radius:2px;background:linear-gradient(90deg,var(--green) 33%,#fff 33% 66%,var(--red) 66%);margin:6px 0}
.sub{color:var(--mut);font-size:13px;margin:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;font:inherit;font-weight:600;font-size:14px;border:0;background:var(--chip);color:var(--tx);padding:9px 14px;border-radius:10px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--green);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.item h3{margin:0;font-size:16px;font-weight:600;line-height:1.2}
.item small{color:var(--mut);font-size:12px;line-height:1.2}
.sz{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.sz button{flex:1 1 56px;font:inherit;border:1px solid var(--line);background:var(--chip);color:var(--tx);border-radius:9px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.1;position:relative}
.sz .l{font-size:11px;color:var(--mut);font-weight:600}
.sz .p{font-size:16px;font-weight:700;color:var(--pr)}
.sz .q{position:absolute;top:-7px;right:-5px;background:var(--red);color:#fff;border-radius:999px;font-size:11px;font-weight:700;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20}
.bar .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .tot{flex:1;min-width:0}.bar .tot span{display:block;font-size:12px;color:var(--mut)}.bar .tot b{font-size:24px;color:var(--pr)}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:14px 18px;cursor:pointer;background:var(--btn);color:var(--btntx);text-decoration:none;text-align:center;display:inline-block}
.btn.go{background:var(--green);color:#fff}.btn.ghost{background:var(--chip);color:var(--tx)}
.btn[aria-disabled="true"],.btn:disabled{opacity:.4;pointer-events:none}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:30;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.sheet .wrap{padding-bottom:30px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:16px}
.line{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.line:last-child{border-bottom:0}
.line .nm{flex:1;min-width:0}.line .amt{font-weight:700;min-width:64px;text-align:right}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--chip);color:var(--tx);font:inherit;font-size:18px;font-weight:700;cursor:pointer}
.qty span{min-width:22px;text-align:center;font-weight:700}
label.f{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
input[type=text],input[type=tel],textarea{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--tx)}
.seg{display:flex;gap:8px}.seg button{flex:1;font:inherit;font-weight:600;padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--panel);color:var(--tx);cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--green);background:var(--green);color:#fff}
.note{font-size:12px;color:var(--mut);margin:8px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button{font:inherit;font-weight:600;font-size:14px;padding:10px 14px;border-radius:999px;border:2px solid var(--line);background:var(--panel);color:var(--tx);cursor:pointer}.chips button[aria-pressed="true"]{border-color:var(--green);background:var(--green);color:#fff}.chips button:disabled{opacity:.35}.opt{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.err{color:var(--red);font-size:13px;margin:8px 0 0}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
<div class="wrap">
 <header><h1>PIZZERIA DEL BOSCO</h1><div class="flag"></div><p class="sub">Taco/Burger · Corniche Kayas Jdid, Bizerte · Livraison à Bizerte et ses environs</p></header>
 <main id="main"></main>
</div>
<div class="bar" id="bar"><div class="in"><div class="tot"><span id="barSub">Panier vide</span><b id="barTot">0 DT</b></div><button class="btn go" id="bOrder" disabled>Commander</button></div></div>
<div class="sheet" id="pick" hidden><div class="wrap" id="pickIn"></div></div>
<div class="sheet" id="sheet" hidden><div class="wrap" id="sheetIn"></div></div>
<script>
const WA="21655334560";
const MENU=[
 {c:"Pizza",items:[
  {n:"Margherita",s:[["Mini",5],["Moy.",10],["Fam.",14]]},
  {n:"Thon",s:[["Mini",7],["Moy.",12],["Fam.",15]]},
  {n:"Peperoni",s:[["Mini",7.5],["Moy.",13],["Fam.",15]]},
  {n:"Escalope",s:[["Mini",8],["Moy.",13.5],["Fam.",16.5]]},
  {n:"Crunchy",s:[["Mini",8.5],["Moy.",15],["Fam.",17.5]]},
  {n:"Mexicain",d:"piquant, poivron, oignon, viande hachée",s:[["Moy.",15.5],["Fam.",19]]},
  {n:"4 fromages",d:"emmental, gruyère, mozzarella, parmesan",s:[["Moy.",17],["Fam.",20]]}]},
 {c:"Tacos",items:[
  {n:"Poulet",s:[["L",12.5],["XL",15]]},
  {n:"Crunchy",s:[["L",13.5],["XL",16]]},
  {n:"Viande hachée",s:[["L",15],["XL",19]]},
  {n:"Del Bosco",d:"4 fromages + 2 choix",s:[["L",19],["XL",22.5]]}]},
 {c:"Taco/Burger",items:[
  {n:"Poulet",s:[["",12]]},{n:"Crunchy",s:[["",13.5]]},{n:"Viande hachée",s:[["",15]]},
  {n:"Del Bosco",d:"2 choix + 2 fromages",s:[["",19]]}]},
 {c:"Baguette",items:[
  {n:"Thon",s:[["Moy.",10],["Maxi",15]]},{n:"Poulet",s:[["Moy.",12],["Maxi",17]]},
  {n:"Crunchy",s:[["Moy.",13],["Maxi",19]]},{n:"Viande hachée",s:[["Moy.",15],["Maxi",21]]}]},
 {c:"Ciabatta",items:[{n:"Jambon",s:[["",6]]},{n:"Thon",s:[["",7]]},{n:"Poulet grillé",s:[["",7.5]]},{n:"Crunchy",s:[["",8.5]]}]},
 {c:"Makloub",items:[{n:"Thon",s:[["",8]]},{n:"Poulet",s:[["",8.5]]},{n:"Crunchy",s:[["",9.5]]},{n:"Viande hachée",s:[["",11.5]]}]},
 {c:"Suppléments",items:[
  {n:"Mozzarella",s:[["",2]]},{n:"Gruyère",s:[["",2]]},{n:"Emmental",s:[["",2]]},{n:"Cheddar",s:[["",2]]},
  {n:"Parmesan",s:[["",3]]},{n:"Poulet",s:[["",4]]},{n:"Crunchy",s:[["",5]]}]},
 {c:"Boissons",items:[
  {n:"Eau 0.5 L",s:[["",1]]},{n:"Eau 1.5 L",s:[["",1.5]]},{n:"Soda bouteille verre",s:[["",1.7]]},{n:"Soda canette",s:[["",2.5]]}]}
];

const $=s=>document.querySelector(s);
const fmt=n=>(Math.round(n*1000)/1000).toString().replace('.',',')+' DT';
const keyOf=(c,n,s)=>c+'|'+n+'|'+s;
const label=(c,n,s)=>(c==="Suppléments"?"+ ":"")+(c==="Pizza"||c==="Tacos"||c==="Baguette"||c==="Ciabatta"||c==="Makloub"||c==="Taco/Burger"?c+" ":"")+n+(s?" "+s:"");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SAUCES=["Pesto","Moutarde","Spicy","Mayo","Barbecue","Burger","Del Bosco","Ketchup","Fromagère","Harissa","Mechouia"],FROMAGES=["Mozzarella","Gruyère","Emmental","Cheddar"],NEEDOPT=["Tacos","Taco/Burger"];
let pick=null;
let tab=MENU[0].c,cart={},form={nom:"",tel:"",mode:"Livraison",adr:"",rem:""},sheet=false;
const total=()=>Object.values(cart).reduce((a,l)=>a+l.p*l.q,0);
const count=()=>Object.values(cart).reduce((a,l)=>a+l.q,0);
function add(c,n,s,p,opt){const k=keyOf(c,n,s)+(opt?'|'+opt:'');cart[k]=cart[k]||{c,n,s,p,q:0,opt:opt||''};cart[k].q++;render()}
const qtyOf=(c,n,s)=>Object.values(cart).filter(l=>l.c===c&&l.n===n&&l.s===s).reduce((a,l)=>a+l.q,0);
function chg(k,d){cart[k].q+=d;if(cart[k].q<=0)delete cart[k];if(!count())sheet=false;render()}
function msg(){
  let t="NOUVELLE COMMANDE · Del Bosco\nNom : "+form.nom.trim()+"\nTél : "+form.tel.trim()+"\nMode : "+form.mode+"\n";
  if(form.mode==="Livraison")t+="Adresse : "+form.adr.trim()+"\n";
  if(form.rem.trim())t+="Remarque : "+form.rem.trim()+"\n";
  t+="---\n";
  Object.values(cart).forEach(l=>t+=l.q+" × "+label(l.c,l.n,l.s)+(l.opt?" ["+l.opt+"]":"")+" = "+fmt(l.p*l.q)+"\n");
  t+="---\nTotal articles : "+fmt(total())+(form.mode==="Livraison"?" (+ frais de livraison)":"");
  return t;
}
function problem(){
  if(!form.nom.trim())return "Écris ton nom.";
  if(form.tel.replace(/\D/g,"").length<8)return "Écris ton numéro de téléphone (8 chiffres).";
  if(form.mode==="Livraison"&&!form.adr.trim())return "Écris ton adresse de livraison.";
  return "";
}
function renderMenu(){
  const cat=MENU.find(x=>x.c===tab);
  const tabs=MENU.map(x=>`<button data-tab="${esc(x.c)}" aria-pressed="${x.c===tab}">${esc(x.c)}</button>`).join('');
  const items=cat.items.map(it=>`<div class="item"><h3>${esc(it.n)}</h3>${it.d?`<small>${esc(it.d)}</small>`:''}<div class="sz">${it.s.map(([sz,p])=>{const q=qtyOf(cat.c,it.n,sz);return `<button data-add="${esc(it.n)}" data-sz="${esc(sz)}" data-p="${p}">${q?`<i class="q" style="font-style:normal">${q}</i>`:''}<span class="l">${esc(sz||'Prix')}</span><span class="p">${fmt(p).replace(' DT','')}</span></button>`}).join('')}</div></div>`).join('');
  const note=(cat.c==="Tacos"||cat.c==="Taco/Burger")?`<p class="note" style="margin:0 0 10px">Pour chaque tacos : 3 sauces au choix et 1 seul fromage.</p>`:'';
  $("#main").innerHTML=`<div class="tabs">${tabs}</div>${note}<div class="grid">${items}</div>`;
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const p=parseFloat(b.dataset.p);if(NEEDOPT.includes(cat.c)){pick={c:cat.c,n:b.dataset.add,s:b.dataset.sz,p,sauces:[],fromage:""};render()}else add(cat.c,b.dataset.add,b.dataset.sz,p)});
}
function renderSheet(){
  const lines=Object.entries(cart).map(([k,l])=>`<div class="line"><div class="nm">${esc(label(l.c,l.n,l.s))}${l.opt?`<span class="opt">${esc(l.opt)}</span>`:''}</div><div class="qty"><button data-m="${esc(k)}" aria-label="Retirer">−</button><span>${l.q}</span><button data-pl="${esc(k)}" aria-label="Ajouter">+</button></div><div class="amt">${fmt(l.p*l.q)}</div></div>`).join('');
  const liv=form.mode==="Livraison";
  const pb=problem();
  $("#sheetIn").innerHTML=`<header><h1>Ma commande</h1><div class="flag"></div></header>
  <div class="card"><h2>Mes articles</h2>${lines}<div class="line"><div class="nm"><b>Total articles</b></div><div class="amt" style="color:var(--pr)">${fmt(total())}</div></div>${liv?'<p class="note">Les frais de livraison sont confirmés par téléphone.</p>':''}</div>
  <div class="card"><h2>Mes informations</h2>
   <div class="seg" role="group" aria-label="Mode"><button data-mode="Livraison" aria-pressed="${liv}">Livraison</button><button data-mode="Emporter" aria-pressed="${!liv}">À emporter</button></div>
   <label class="f" for="fNom">Nom</label><input type="text" id="fNom" autocomplete="name" value="${esc(form.nom)}">
   <label class="f" for="fTel">Numéro de téléphone</label><input type="tel" id="fTel" autocomplete="tel" inputmode="tel" value="${esc(form.tel)}">
   ${liv?`<label class="f" for="fAdr">Adresse de livraison</label><textarea id="fAdr" rows="2">${esc(form.adr)}</textarea>`:''}
   <label class="f" for="fRem">Remarque (sauces, sans oignon…)</label><textarea id="fRem" rows="2">${esc(form.rem)}</textarea>
  </div>
  <p class="err" id="err">${esc(pb)}</p>
  <a class="btn go" id="send" target="_blank" rel="noopener" style="display:block;margin-top:10px" aria-disabled="${pb?'true':'false'}" href="${pb?'#':'https://wa.me/'+WA+'?text='+encodeURIComponent(msg())}">Envoyer ma commande sur WhatsApp</a>
  <p class="note">WhatsApp s'ouvre avec ta commande déjà écrite. Appuie sur envoyer. Le restaurant t'appelle pour confirmer.</p>
  <button class="btn ghost" id="back" style="width:100%;margin-top:12px">Retour au menu</button>`;
  const upd=()=>{const p=problem();$("#err").textContent=p;const a=$("#send");a.setAttribute('aria-disabled',p?'true':'false');a.href=p?'#':'https://wa.me/'+WA+'?text='+encodeURIComponent(msg())};
  $("#fNom").oninput=e=>{form.nom=e.target.value;upd()};$("#fTel").oninput=e=>{form.tel=e.target.value;upd()};$("#fRem").oninput=e=>{form.rem=e.target.value;upd()};
  if($("#fAdr"))$("#fAdr").oninput=e=>{form.adr=e.target.value;upd()};
  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{form.mode=b.dataset.mode;renderSheet()});
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>chg(b.dataset.m,-1));
  document.querySelectorAll('[data-pl]').forEach(b=>b.onclick=()=>chg(b.dataset.pl,1));
  $("#back").onclick=()=>{sheet=false;render()};
}
function renderPick(){
  const tb=pick.c==="Taco/Burger";const ok=pick.sauces.length===3&&(tb||pick.fromage);
  const ss=SAUCES.map(x=>{const on=pick.sauces.includes(x);return `<button data-sa="${esc(x)}" aria-pressed="${on}" ${!on&&pick.sauces.length>=3?'disabled':''}>${esc(x)}</button>`}).join('');
  const ff=FROMAGES.map(x=>`<button data-fr="${esc(x)}" aria-pressed="${pick.fromage===x}">${esc(x)}</button>`).join('');
  $("#pickIn").innerHTML=`<header><h1>${esc(label(pick.c,pick.n,pick.s))}</h1><div class="flag"></div><p class="sub">${fmt(pick.p)}</p></header>
  <div class="card" style="border-color:var(--green)">${tb?'<b>Obligatoire :</b> choisis <b>3 sauces</b>. Le <b>4 fromages</b> est déjà inclus.':'<b>Obligatoire :</b> choisis <b>3 sauces</b> et <b>1 seul fromage</b> pour ce tacos.'}</div>
  <div class="card"><h2>Sauces (${pick.sauces.length}/3)</h2><div class="chips">${ss}</div></div>
  ${tb?'':`<div class="card"><h2>Fromage (1 seul)</h2><div class="chips">${ff}</div></div>`}
  ${ok?'':`<p class="err">${pick.sauces.length<3?'Il manque '+(3-pick.sauces.length)+' sauce'+(3-pick.sauces.length>1?'s':''):''}${pick.sauces.length<3&&!tb&&!pick.fromage?' et ':''}${!tb&&!pick.fromage?'le fromage':''}.</p>`}
  <button class="btn go" id="pkOk" style="width:100%" ${ok?'':'disabled'}>Ajouter au panier</button>
  <button class="btn ghost" id="pkNo" style="width:100%;margin-top:10px">Annuler</button>`;
  document.querySelectorAll('[data-sa]').forEach(b=>b.onclick=()=>{const x=b.dataset.sa,i=pick.sauces.indexOf(x);if(i>=0)pick.sauces.splice(i,1);else if(pick.sauces.length<3)pick.sauces.push(x);renderPick()});
  document.querySelectorAll('[data-fr]').forEach(b=>b.onclick=()=>{pick.fromage=b.dataset.fr;renderPick()});
  $("#pkNo").onclick=()=>{pick=null;render()};
  $("#pkOk").onclick=()=>{const p=pick;pick=null;add(p.c,p.n,p.s,p.p,"Sauces : "+p.sauces.join(", ")+" | Fromage : "+(p.c==="Taco/Burger"?"4 fromages":p.fromage));toast("Ajouté au panier")};
}
function toast(t){let e=document.getElementById('tst');if(!e){e=document.createElement('div');e.id='tst';e.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:110px;background:var(--btn);color:var(--btntx);padding:10px 16px;border-radius:999px;font-weight:600;z-index:40';document.body.appendChild(e)}e.textContent=t;e.hidden=false;clearTimeout(e._t);e._t=setTimeout(()=>e.hidden=true,1500)}
function render(){
  renderMenu();
  const n=count();$("#barTot").textContent=fmt(total());$("#barSub").textContent=n?n+" article"+(n>1?"s":""):"Panier vide";$("#bOrder").disabled=!n;
  $("#pick").hidden=!pick;$("#sheet").hidden=!sheet||!!pick;$("#bar").hidden=sheet||!!pick;if(pick)renderPick();
  if(sheet)renderSheet();
}
$("#bOrder").onclick=()=>{sheet=true;render();window.scrollTo(0,0)};
render();
</script>
</body></html>
